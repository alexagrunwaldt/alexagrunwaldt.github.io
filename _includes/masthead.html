{% include base_path %}
<header class="masthead">
  <div class="masthead__bar">
    <span class="masthead__date">{{ site.time | date: "%m.%d.%y" }}</span>
    <span class="masthead__role">PhD Candidate, Yale Economics</span>
  </div>
  {% if page.url == "/" %}
    <h1 class="masthead__title">{{ site.title }}</h1>
  {% else %}
    <h1 class="masthead__title">{{ page.title | default: site.title }}</h1>
  {% endif %}
</header>
